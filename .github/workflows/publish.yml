####################################################################################
# GitHub Action:
# Whenever creating a new release of the source code.
####################################################################################
# Steps to execute:
# - Checkout the source code
# - Run "composer install" for production (required dependencies are already under vendor/)
# - Create a .zip file, excluding:
#   - All hidden files (.git, .gitignore, etc)
#   - All development files, ending in .dist or .xml
#   - All composer files <= after installing dependencies, no need for them anymore
#   - Markdown files concerning development
#   - JS Package files.
#   - Folder build/ <= created only to store the .zip file
#   - Folder bin/ <= not needed for the plugin
#   - Folder tests/ <= not needed for the plugin
# - Upload the .zip file as an artifact to the action (this step is possibly optional)
# - Upload the .zip file as a release, for download
####################################################################################
name: Generate Installable Plugin and Upload as Release Asset

on:
  release:
    types: [ published ]

# Uploading release assets needs write access to contents; nothing else.
permissions:
  contents: write

jobs:
  Build:
    name: Build and Upload Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Release Version env
        # Pass the tag via env, not `${{ }}` in the script, so a tag name can't inject shell commands.
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$TAG_NAME"
          echo "Release Version: ${VERSION//v}"
          echo "RELEASE_VERSION=${VERSION//v}" >> $GITHUB_ENV

      # see https://github.com/shivammathur/setup-php
      - name: Use PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.3
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Run npm
        run: |
          npm install
          npm run build
          npm install --only=production --omit=dev

      - name: Build project for production
        run: |
          echo "Release Version: $RELEASE_VERSION"
          composer update --no-dev --optimize-autoloader
          mkdir release

      - name: Create artifact
        uses: montudor/action-zip@a8e75c9faefcd80fac3baf53ef40b9b119d5b702 # v1
        with:
          args: zip -X -r release/wp-email-download.zip . -x *.git* bin** !block !node_modules node_modules/\* .* "*/\.*" *.dist *.xml composer.* package*.json tests** release**

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wp-email-download
          path: release/wp-email-download.zip

      - name: Upload to release
        uses: JasonEtco/upload-to-release@d648f1babf776de9cad881320bd9e9818fc3b262 # master
        with:
          args: release/wp-email-download.zip application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token

      - name: Duplicate asset for GitHub Updater
        # @see https://github.com/afragen/github-updater/wiki/Settings#release-assets
        uses: montudor/action-zip@a8e75c9faefcd80fac3baf53ef40b9b119d5b702 # v1
        with:
          args: zip -X -r release/wp-email-download-${{ env.RELEASE_VERSION }}.zip . -x *.git* bin** !block !node_modules node_modules/\* .* "*/\.*" *.dist *.xml composer.* package*.json tests** release**

      - name: Upload duplicate to release
        uses: JasonEtco/upload-to-release@d648f1babf776de9cad881320bd9e9818fc3b262 # master
        with:
          args: release/wp-email-download-${{ env.RELEASE_VERSION }}.zip application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
